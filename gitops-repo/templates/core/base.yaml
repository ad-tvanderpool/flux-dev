apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: base
  namespace: flux-data
spec:
  interval: 1m0s
  retryInterval: 20s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./base/template
  wait: false
  prune: true
  timeout: 10m
