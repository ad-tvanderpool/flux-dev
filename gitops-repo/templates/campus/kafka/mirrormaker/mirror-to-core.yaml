apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaMirrorMaker2
metadata:
  name: mirror-to-core
  namespace: kafka
spec:
  version: "4.1.1"
  replicas: 3
  connectCluster: core
  clusters:
    - alias: campus
      bootstrapServers: localhost:9092
    - alias: core
      bootstrapServers: PLACEHOLDER_CORE_BOOTSTRAP
  mirrors:
    - sourceCluster: campus
      targetCluster: core
      sourceConnector:
        config:
          replication.factor: 3
          offset-syncs.topic.replication.factor: 
          sync.topic.acls.enabled: "false"
        tasksMax: 3
      checkpointConnector:
        config:
          checkpoints.topic.replication.factor: 3
        tasksMax: 3
      heartbeatConnector:
        config:
          heartbeats.topic.replication.factor: 3
        tasksMax: 3
      topicsPattern: ".*"
      groupsPattern: ".*"
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        key: mirrormaker-metrics-config.yml
        name: mirrormaker-metrics