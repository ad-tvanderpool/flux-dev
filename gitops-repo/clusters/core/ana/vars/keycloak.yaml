apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars-keycloak
  namespace: flux-data
data:
  # Keycloak admin console URL (KC_HOSTNAME_ADMIN). Separated from the main
  # hostname so the token 'iss' claim stays at :443 while the admin console
  # is reachable via a non-privileged port-forward on :8080.
  # Keycloak runs HTTP-only in this cluster (httpEnabled: true, no TLS keystore),
  # so :8443 is never bound — use HTTP on port 8080 instead.
  # Keycloak hostname and admin console URL. Both set to HTTP:8080 because
  # Keycloak runs HTTP-only in this cluster (httpEnabled:true, no TLS keystore
  # — port 8443 is declared but never bound). Keeping both the same origin
  # eliminates the "3rd party check iframe" timeout in the admin console.
  HOSTNAME: "http://keycloak.cluster.local:8080"
  ADMIN_HOSTNAME: "http://keycloak.cluster.local:8080"
